    <div id="ftNotifPanel" class="panel hidden"></div>
    <div id="ftDMPanel" class="panel hidden"></div>
    <div
      class="confirm-modal hidden"
      id="roleSwitchModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="roleSwitchTitle"
    >
      <div class="confirm-card">
        <h3 id="roleSwitchTitle">Switch AI role?</h3>
        <p id="roleSwitchMessage">
          There is an existing conversation. Switching roles now will reset the
          current transcript and call state.
        </p>
        <div class="confirm-actions">
          <button class="btn ghost" type="button" onclick="cancelRoleSwitch()">
            Cancel
          </button>
          <button class="btn mag" type="button" onclick="confirmRoleSwitch()">
            Continue
          </button>
        </div>
      </div>
    </div>
    <div
      class="confirm-modal hidden"
      id="appConfirmModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="appConfirmTitle"
    >
      <div class="confirm-card">
        <h3 id="appConfirmTitle">Confirm action?</h3>
        <p id="appConfirmMessage">
          Please confirm before continuing.
        </p>
        <div class="confirm-actions">
          <button
            class="btn ghost"
            type="button"
            onclick="cancelAppConfirm()"
          >
            Cancel
          </button>
          <button
            class="btn"
            id="appConfirmButton"
            type="button"
            onclick="confirmAppConfirm()"
          >
            Continue
          </button>
        </div>
      </div>
    </div>
    <button
      id="kbbotFab"
      class="kbbot-fab"
      title="Ask FeeBe (Knowledge Base)"
      onclick="toggleKBBot()"
    >
      🤖
    </button>
    <div
      id="kbbotPanel"
      class="kbbot-panel hidden"
    >
      <div class="kbbot-head">
        <b>🤖 Ask FeeBe · Knowledge Base</b
        ><button class="kbbot-close" onclick="toggleKBBot()">
          ✕
        </button>
      </div>
      <div id="kbbotBody" class="kbbot-body"></div>
      <div class="kbbot-input-row">
        <input
          class="inp u-flex-1"
          id="kbbotInput"
          aria-label="Ask a knowledge base question"
          placeholder="Ask a KB question…"

          onkeydown="if(event.key==='Enter'){event.preventDefault();botSend();}"
        /><button class="btn" id="kbbotSend" onclick="botSend()">Send</button>
      </div>
    </div>
