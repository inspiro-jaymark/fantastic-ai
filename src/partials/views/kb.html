        <section id="kb" class="view hidden">
          <div class="card">
            <h3>
              <span class="ic">📚</span> Knowledge Base
              <span class="badge" id="kbCount">0</span>
            </h3>
            <div class="trainer-box">
              <h4>📎 Add Documents & Web Sources</h4>
              <div class="tgrid">
                <div>
                  <label class="fld" for="ftKBFiles"
                    >Upload files (PDF/Word/Excel/images/txt/csv, max 50
                    MB)</label
                  ><input
                    class="inp"
                    type="file"
                    id="ftKBFiles"
                    multiple
                    accept=".pdf,.doc,.docx,.docm,.xls,.xlsx,.xlsm,.xlsb,.txt,.csv,image/*"
                    onchange="kbUpload(event)"
                  />
                </div>
                <div>
                  <label class="fld" for="ftKBUrl"
                    >Connect a public website (fetch text)</label
                  >
                  <div class="row">
                    <input
                      class="inp u-flex-1"
                      id="ftKBUrl"
                      placeholder="https://example.com/help"

                    /><button class="btn" onclick="kbFetch()">🌐 Fetch</button>
                  </div>
                </div>
              </div>
              <div class="conn" id="ftKBMsg"></div>
              <div class="u-mt-10" id="ftKBAssets"></div>
            </div>
            <div class="trainer-box">
              <h4>🧑‍🏫 Trainer: Add / Update Module</h4>
              <div class="tgrid">
                <div>
                  <label class="fld" for="tTitle">Title</label
                  ><input
                    class="inp"
                    id="tTitle"
                    placeholder="How do I set up eSIM?"
                  />
                </div>
                <div>
                  <label class="fld" for="tCat">Category</label
                  ><select class="inp" id="tCat">
                    <option>Billing & Payments</option>
                    <option>Technical Support</option>
                    <option>Account & Security</option>
                    <option>Plans & Upgrades</option>
                    <option>Refunds & Disputes</option>
                    <option>General / Policy</option>
                  </select>
                </div>
              </div>
              <label class="fld" for="tBody">Answer</label
              ><textarea
                id="tBody"
                placeholder="The answer the AI should give…"
              ></textarea>
              <div class="tgrid u-mt-10">
                <div>
                  <label class="fld" for="tKeys">Keywords</label
                  ><input
                    class="inp"
                    id="tKeys"
                    placeholder="esim, sim, activate"
                  />
                </div>
                <div>
                  <label class="fld" for="tLink">Reference link</label
                  ><input class="inp" id="tLink" placeholder="https://…" />
                </div>
              </div>
              <div class="row u-mt-12">
                <button class="btn" onclick="addModule()">➕ Add</button
                ><button class="btn ghost" onclick="exportKB()">
                  ⬇️ Export</button
                ><span class="note u-m-0" id="tMsg"></span>
              </div>
            </div>
            <input class="search" id="kbSearch" aria-label="Search knowledge base" placeholder="🔍 Search…" />
            <div id="kbList"></div>
          </div>
        </section>
