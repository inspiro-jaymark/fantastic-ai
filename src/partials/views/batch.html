        <section id="batch" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">📤</span> Batch Upload
              </h3>
              <div class="note">Paste or CSV-upload transcripts.</div>
            </div>
          </div>
          <div class="grid g2">
            <div class="card">
              <h3><span class="ic">✍️</span> Paste Single</h3>
              <div class="tgrid">
                <div>
                  <label class="fld" for="bFile">File Name</label
                  ><input class="inp" id="bFile" placeholder="call_001.wav" />
                </div>
                <div>
                  <label class="fld" for="bAgent">Agent Name</label
                  ><input
                    class="inp"
                    id="bAgent"
                    placeholder="Juan Dela Cruz"
                  />
                </div>
              </div>
              <div class="tgrid">
                <div>
                  <label class="fld" for="bAgentId">Agent ID</label
                  ><input
                    class="inp"
                    id="bAgentId"
                    placeholder="EMP-1001"
                    oninput="batchLookup()"
                  />
                </div>
                <div>
                  <label class="fld" for="bStart">Start</label
                  ><input class="inp" id="bStart" type="datetime-local" />
                </div>
              </div>
              <div class="tgrid">
                <div>
                  <label class="fld" for="bEnd">End</label
                  ><input class="inp" id="bEnd" type="datetime-local" />
                </div>
                <div>
                  <label class="fld" for="bLang">Language</label
                  ><select class="sel inp" id="bLang">
                    <option>English</option>
                    <option>Tagalog</option>
                    <option>Cebuano</option>
                    <option>Hiligaynon</option>
                    <option>Ilokano</option>
                    <option>Waray</option>
                    <option>Taglish</option>
                  </select>
                </div>
              </div>
              <div class="conn" id="bMatch"></div>
              <label class="fld" for="bConvo">Conversation (Agent:/Customer:)</label
              ><textarea
                class="ta"
                id="bConvo"
                placeholder="Agent: Thank you for calling...&#10;Customer: My bill is wrong..."
              ></textarea>
              <div class="row u-mt-10">
                <button class="btn" onclick="batchAddSingle()">
                  ➕ Evaluate & save</button
                ><button class="btn ghost" onclick="batchClearForm()">
                  Clear</button
                ><span class="note u-m-0" id="bMsg"></span>
              </div>
            </div>
            <div class="card">
              <h3><span class="ic">📁</span> Bulk CSV</h3>
              <div class="assist">
                <b>Columns:</b>
                <span class="mono"
                  >File Name, Agent Name, Agent ID, Conversation, Interaction
                  Start Time, Interaction End Time</span
                >
              </div>
              <label
                class="btn ghost u-cursor-pointer u-inline-block"

                >⬆️ Choose CSV<input class="hidden"
                  type="file"
                  id="bCsv"
                  accept=".csv"

                  onchange="batchUploadCSV(event)" /></label
              ><button class="btn ghost" onclick="downloadCSVTemplate()">
                ⬇️ Template
              </button>
              <div class="conn" id="bCsvMsg"></div>
            </div>
          </div>
          <div class="card u-mt-20">
            <div class="folder-head">
              <h3>
                <span class="ic">📋</span> Processed
                <span class="badge" id="batchCount">0</span>
              </h3>
              <div class="row">
                <button class="btn ghost" onclick="exportBatch()">
                  ⬇️ Export</button
                ><button
                  class="btn ghost"
                  onclick="exportQAResults(loadBatch(),'FANTASTIC_QA_batch_results.csv')"
                >
                  ⬇️ Export QA Results (CSV)
                </button>
              </div>
            </div>
            <div class="u-overflow-x-auto">
              <table id="batchTable">
                <tr>
                  <th>File</th>
                  <th>Agent</th>
                  <th>ID</th>
                  <th>Site/BU</th>
                  <th>Turns</th>
                  <th>Score</th>
                  <th>Outcome</th>
                </tr>
              </table>
            </div>
            <div
              class="note u-empty-inline"
              id="batchEmpty"

            >
              No records yet.
            </div>
          </div>
        </section>
