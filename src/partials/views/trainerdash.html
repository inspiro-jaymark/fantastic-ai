        <section id="trainerdash" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">🧑‍🏫</span> Trainer Dashboard
              </h3>
              <div class="note">
                Enrollment recommendations from QA + training topics (Markdown).
              </div>
            </div>
          </div>
          <div class="grid g4" id="trKpis"></div>
          <div class="grid g2 u-mt-20">
            <div class="card">
              <div class="folder-head">
                <h3 class="u-m-0">
                  <span class="ic">🎓</span> Enrollment Queue
                </h3>
                <select
	                  class="sel"
	                  id="trEnrollFilter"
	                  aria-label="Enrollment status filter"
	                  onchange="renderTrainer()"
                >
                  <option value="all">All</option>
                  <option value="pending">Pending</option>
                  <option value="enrolled">Enrolled</option>
                  <option value="completed">Completed</option>
                </select>
              </div>
              <div id="trEnrollList"></div>
            </div>
            <div class="card">
              <h3><span class="ic">📚</span> Training Topics</h3>
              <div class="tgrid">
                <div>
	                  <label class="fld" for="trTopicName">Topic name</label
                  ><input
                    class="inp"
                    id="trTopicName"
                    placeholder="e.g. De-escalation"
                  />
                </div>
                <div class="u-flex u-align-end">
                  <button
                    class="btn u-w-full"

                    onclick="trSaveTopic()"
                  >
                    💾 Save
                  </button>
                </div>
              </div>
	              <label class="fld" for="trTopicMd">Markdown content</label
              ><textarea
                id="trTopicMd"
                placeholder="# Title&#10;- point&#10;**bold**"
              ></textarea>
              <div class="row u-mt-8">
                <button class="btn ghost" onclick="trPreview()">
                  👁 Preview
                </button>
              </div>
              <div class="u-mt-12" id="trTopicList"></div>
              <div
                id="trPreview"
                class="script-card hidden u-mt-10"

              ></div>
            </div>
          </div>
        </section>
