        <section id="access" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">🔐</span> Access Management
              </h3>
              <div class="note">Users, roles & permissions. Admin-only.</div>
            </div>
            <div class="row">
              <button class="btn ghost" onclick="exportUsers()">
                ⬇️ Export</button
              ><label class="btn ghost u-cursor-pointer"
                >⬆️ Import<input class="hidden"
                  type="file"
                  id="userImport"
                  accept=".csv"

                  onchange="importUsers(event)"
              /></label>
            </div>
          </div>
          <div class="card">
            <h3><span class="ic">➕</span> Add / Update User</h3>
            <div class="db-form">
              <div>
                <label class="fld" for="uUser">Username</label
                ><input class="inp" id="uUser" placeholder="jdelacruz" />
              </div>
              <div>
                <label class="fld" for="uName">Full Name</label
                ><input class="inp" id="uName" placeholder="Juan Dela Cruz" />
              </div>
              <div>
                <label class="fld" for="uPass">Password</label>
                <div class="password-wrap">
                  <input
                    class="inp"
                    id="uPass"
                    type="password"
                    placeholder="password"
                  />
                  <button
                    class="password-toggle"
                    type="button"
                    data-password-toggle="uPass"
                    aria-label="Show password"
                    title="Show password"
                  >
                    <span class="password-icon password-icon-eye" aria-hidden="true">
                      <svg viewBox="0 0 24 24">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                    </span>
                    <span class="password-icon password-icon-eye-off" aria-hidden="true">
                      <svg viewBox="0 0 24 24">
                        <path d="m3 3 18 18" />
                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                        <path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.3 3.5" />
                        <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8" />
                      </svg>
                    </span>
                  </button>
                </div>
              </div>
              <div>
                <label class="fld" for="uRole">Role</label
                ><select class="inp" id="uRole">
                  <option value="agent">🎧 Agent</option>
                  <option value="evaluator">✅ Evaluator</option>
                  <option value="supervisor">🧑‍✈️ Supervisor</option>
                  <option value="trainer">🧑‍🏫 Trainer</option>
                  <option value="fraud">🛡️ Fraud Analyst</option>
                  <option value="admin">👑 Admin</option>
                </select>
              </div>
              <div>
                <label class="fld" for="uEmp">Linked Employee #</label
                ><input class="inp" id="uEmp" placeholder="EMP-1001" />
              </div>
              <div>
                <label class="fld" for="uStatus">Status</label
                ><select class="inp" id="uStatus">
                  <option value="active">Active</option>
                  <option value="disabled">Disabled</option>
                </select>
              </div>
              <div class="u-flex u-align-end">
                <button class="btn u-w-full" onclick="saveUser()">
                  💾 Save
                </button>
              </div>
              <div class="u-flex u-align-end">
                <button
                  class="btn ghost u-w-full"

                  onclick="clearUserForm()"
                >
                  Clear
                </button>
              </div>
            </div>
            <span class="note" id="uMsg"></span>
          </div>
          <div class="card u-mt-20">
            <div class="folder-head">
              <h3>
                <span class="ic">👥</span> Users
                <span class="badge" id="uCount">0</span>
              </h3>
              <input
                class="search u-max-w-240 u-mb-0"
                id="uSearch"
                aria-label="Search users"
                placeholder="🔍 Search…"

                oninput="renderUsers()"
              />
            </div>
            <div class="u-overflow-x-auto">
              <table id="uTable">
                <tr>
                  <th>Username</th>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Emp #</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </table>
            </div>
          </div>
          <div class="card u-mt-20">
            <h3><span class="ic">🧩</span> Roles & Permissions</h3>
            <div class="role-builder">
              <div class="folder-head">
                <div>
                  <h4 class="u-m-0 u-fs-14">Create Custom Role</h4>
                  <div class="note">
                    Start from a fixed role, then choose the access this custom
                    role should keep.
                  </div>
                </div>
                <span class="badge" id="roleEditBadge">New</span>
              </div>
              <div class="db-form role-form">
                <div>
                  <label class="fld" for="roleName">Role name</label>
                  <input class="inp" id="roleName" placeholder="QA Lead" />
                </div>
                <div>
                  <label class="fld" for="roleBase">Base fixed role</label>
                  <select
                    class="inp"
                    id="roleBase"
                    onchange="loadRoleBaseTemplate()"
                  ></select>
                </div>
                <div>
                  <label class="fld" for="roleHome">Default view</label>
                  <select class="inp" id="roleHome"></select>
                </div>
                <div>
                  <label class="fld" for="roleDesc">Description</label>
                  <input
                    class="inp"
                    id="roleDesc"
                    placeholder="What this role can do"
                  />
                </div>
              </div>
              <fieldset class="role-perm-box">
                <legend class="fld">Permissions</legend>
                <div class="role-perm-grid" id="rolePerms"></div>
              </fieldset>
              <div class="row u-mt-10">
                <button class="btn" onclick="saveCustomRole()">
                  💾 Save custom role
                </button>
                <button class="btn ghost" onclick="resetCustomRoleForm()">
                  New
                </button>
                <button
                  class="btn ghost hidden"
                  id="roleDeleteBtn"
                  onclick="deleteCustomRole()"
                >
                  🗑 Delete
                </button>
                <span class="note u-m-0" id="roleMsg"></span>
              </div>
            </div>
            <div class="u-mt-14" id="roleMatrix"></div>
          </div>
        </section>
