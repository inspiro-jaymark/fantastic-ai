        <section id="agentdb" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 style="font-size: 17px">
                <span class="ic">👥</span> Agent Database
              </h3>
              <div class="note">Master roster.</div>
            </div>
            <div class="row">
              <button class="btn ghost" onclick="exportAgents()">
                ⬇️ Export</button
              ><label class="btn ghost" style="cursor: pointer"
                >⬆️ Import<input
                  type="file"
                  id="agImport"
                  accept=".csv"
                  style="display: none"
                  onchange="importAgents(event)"
              /></label>
            </div>
          </div>
          <div class="card">
            <h3><span class="ic">➕</span> Add / Update Agent</h3>
            <div class="db-form">
              <div>
                <label class="fld">Employee #</label
                ><input class="inp" id="agEmp" placeholder="EMP-1001" />
              </div>
              <div>
                <label class="fld">First Name</label
                ><input class="inp" id="agFirst" placeholder="Juan" />
              </div>
              <div>
                <label class="fld">Last Name</label
                ><input class="inp" id="agLast" placeholder="Dela Cruz" />
              </div>
              <div>
                <label class="fld">Site</label
                ><select class="inp" id="agSite">
                  <option>Circuit</option>
                  <option>Dumaguete</option>
                  <option>Pasig</option>
                  <option>Nicaragua</option>
                  <option>Makati</option>
                  <option>Manila</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld">BU</label
                ><select class="inp" id="agBU">
                  <option>JAPAC</option>
                  <option>International</option>
                  <option>Infocom</option>
                  <option>Dish</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld">Section</label
                ><select class="inp" id="agSection">
                  <option>PLDT</option>
                  <option>Smart</option>
                  <option>PNB</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld">Sub-section</label
                ><select class="inp" id="agSub">
                  <option>Billing</option>
                  <option>Repair</option>
                  <option>Prepaid</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div style="display: flex; align-items: flex-end">
                <button class="btn" style="width: 100%" onclick="saveAgent()">
                  💾 Save
                </button>
              </div>
              <div style="display: flex; align-items: flex-end">
                <button
                  class="btn ghost"
                  style="width: 100%"
                  onclick="clearAgentForm()"
                >
                  Clear
                </button>
              </div>
            </div>
            <span class="note" id="agMsg"></span>
          </div>
          <div class="card" style="margin-top: 20px">
            <div class="folder-head">
              <h3>
                <span class="ic">📇</span> Roster
                <span class="badge" id="agCount">0</span>
              </h3>
              <div class="row">
                <button class="btn ghost" onclick="seedAgents()">
                  🌱 Load sample</button
                ><input
                  class="search"
                  id="agSearch"
                  placeholder="🔍 Search…"
                  style="max-width: 220px; margin-bottom: 0"
                />
              </div>
            </div>
            <div style="overflow-x: auto">
              <table id="agTable">
                <tr>
                  <th>Emp #</th>
                  <th>Name</th>
                  <th>Site</th>
                  <th>BU</th>
                  <th>Section</th>
                  <th>Sub</th>
                  <th></th>
                </tr>
              </table>
            </div>
            <div
              class="note"
              id="agEmpty"
              style="text-align: center; margin: 20px"
            >
              No agents yet.
            </div>
          </div>
        </section>
