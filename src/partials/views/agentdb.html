        <section id="agentdb" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">👥</span> Agent Database
              </h3>
              <div class="note">Master roster.</div>
            </div>
            <div class="row">
              <button class="btn ghost" onclick="exportAgents()">
                ⬇️ Export</button
              ><label class="btn ghost u-cursor-pointer"
                >⬆️ Import<input class="hidden"
                  type="file"
                  id="agImport"
                  accept=".csv"

                  onchange="importAgents(event)"
              /></label>
            </div>
          </div>
          <div class="card">
            <h3><span class="ic">➕</span> Add / Update Agent</h3>
            <div class="db-form">
              <div>
                <label class="fld" for="agEmp">Employee #</label
                ><input class="inp" id="agEmp" placeholder="EMP-1001" />
              </div>
              <div>
                <label class="fld" for="agFirst">First Name</label
                ><input class="inp" id="agFirst" placeholder="Juan" />
              </div>
              <div>
                <label class="fld" for="agLast">Last Name</label
                ><input class="inp" id="agLast" placeholder="Dela Cruz" />
              </div>
              <div>
                <label class="fld" for="agSite">Site</label
                ><select class="inp" id="agSite">
                  <option>Circuit</option>
                  <option>Dumaguete</option>
                  <option>Pasig</option>
                  <option>Nicaragua</option>
                  <option>Makati</option>
                  <option>Manila</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld" for="agBU">BU</label
                ><select class="inp" id="agBU">
                  <option>JAPAC</option>
                  <option>International</option>
                  <option>Infocom</option>
                  <option>Dish</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld" for="agSection">Section</label
                ><select class="inp" id="agSection">
                  <option>PLDT</option>
                  <option>Smart</option>
                  <option>PNB</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div>
                <label class="fld" for="agSub">Sub-section</label
                ><select class="inp" id="agSub">
                  <option>Billing</option>
                  <option>Repair</option>
                  <option>Prepaid</option>
                  <option value="__add">➕ Add…</option>
                </select>
              </div>
              <div class="u-flex u-align-end">
                <button class="btn u-w-full" onclick="saveAgent()">
                  💾 Save
                </button>
              </div>
              <div class="u-flex u-align-end">
                <button
                  class="btn ghost u-w-full"

                  onclick="clearAgentForm()"
                >
                  Clear
                </button>
              </div>
            </div>
            <span class="note" id="agMsg"></span>
          </div>
          <div class="card u-mt-20">
            <div class="folder-head">
              <h3>
                <span class="ic">📇</span> Roster
                <span class="badge" id="agCount">0</span>
              </h3>
              <div class="row">
                <button class="btn ghost" onclick="seedAgents()">
                  🌱 Load sample</button
                ><input
                  class="search u-max-w-220 u-mb-0"
                  id="agSearch"
                  aria-label="Search agents"
                  placeholder="🔍 Search…"

                />
              </div>
            </div>
            <div class="u-overflow-x-auto">
              <table id="agTable">
                <tr>
                  <th>Emp #</th>
                  <th>Name</th>
                  <th>Site</th>
                  <th>BU</th>
                  <th>Section</th>
                  <th>Sub</th>
                  <th></th>
                </tr>
              </table>
            </div>
            <div
              class="note u-empty-inline"
              id="agEmpty"

            >
              No agents yet.
            </div>
          </div>
        </section>
