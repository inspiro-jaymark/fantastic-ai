        <section id="supervisordash" class="view hidden">
          <h3 style="font-size: 18px; margin-bottom: 14px">
            <span class="ic">🧑‍✈️</span> Supervisor Dashboard
          </h3>
          <div class="grid g4" id="svKpis"></div>
          <div class="grid g2" style="margin-top: 20px">
            <div class="card">
              <h3><span class="ic">📥</span> Pending QA Evaluations</h3>
              <div id="svPending"></div>
            </div>
            <div class="card">
              <h3><span class="ic">🎯</span> Recommended Enrollments</h3>
              <div id="svEnroll"></div>
            </div>
          </div>
          <div class="card" id="coachCard" style="margin-top: 20px">
            <h3><span class="ic">📝</span> Send Coaching Note to Agent</h3>
            <div class="tgrid">
              <div>
                <label class="fld">Agent</label
                ><select class="inp" id="coachAgent"></select>
              </div>
              <div>
                <label class="fld">Focus topic (optional)</label
                ><input
                  class="inp"
                  id="coachTopic"
                  placeholder="e.g. De-escalation"
                />
              </div>
            </div>
            <label class="fld">Coaching note (Markdown)</label
            ><textarea
              id="coachMd"
              placeholder="## Great job&#10;- **Empathy** on point&#10;## Improve&#10;- Verify ID first"
            ></textarea>
            <div class="row" style="margin-top: 8px">
              <button class="btn" onclick="sendCoach()">📤 Send to agent</button
              ><button class="btn ghost" onclick="coachPreview()">
                👁 Preview</button
              ><span class="note" id="coachMsg" style="margin: 0"></span>
            </div>
            <div
              id="coachPrev"
              class="script-card hidden"
              style="margin-top: 10px"
            ></div>
            <div style="margin-top: 14px">
              <h3 style="font-size: 14px">
                <span class="ic">🗂️</span> Coaching History
              </h3>
              <div id="coachHist"></div>
            </div>
          </div>
        </section>
