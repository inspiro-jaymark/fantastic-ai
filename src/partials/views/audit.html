        <section id="audit" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">🧾</span> Audit Log
                <span
                  class="pill-count hidden u-bg-teal"
                  id="auditTabCount"

                  >0</span
                >
              </h3>
              <div class="note">Trail of admin-relevant actions.</div>
            </div>
            <div class="row audit-row-4">
              <select class="sel" id="auditCat" aria-label="Audit category" onchange="renderAudit()">
                <option value="all">All categories</option>
                <option value="auth">Authentication</option>
                <option value="user">User mgmt</option>
                <option value="agent">Agent DB</option>
                <option value="config">Config/AI</option>
                <option value="data">Data</option>
                <option value="export">Exports</option></select
              ><input
                class="search u-mb-0"
                id="auditSearch"
                aria-label="Search audit log"
                placeholder="🔍 Search…"

                oninput="renderAudit()"
              /><button type="button" class="btn ghost" onclick="exportAudit()">
                ⬇️ Export</button
              ><button
                type="button"
                class="btn u-bg-red"

                onclick="clearAudit()"
              >
                🗑️ Clear
              </button>
            </div>
          </div>
          <div class="grid g4" id="auditKpis"></div>
          <div class="card u-mt-20">
            <div class="u-overflow-x-auto">
              <table id="auditTable">
                <tr>
                  <th>Time</th>
                  <th>User</th>
                  <th>Role</th>
                  <th>Category</th>
                  <th>Action</th>
                  <th>Detail</th>
                </tr>
              </table>
            </div>
            <div
              class="note u-empty-inline"
              id="auditEmpty"

            >
              No audit entries yet.
            </div>
          </div>
        </section>
