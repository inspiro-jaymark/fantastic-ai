        <section id="sup" class="view hidden">
          <div class="grid g3">
            <div class="card u-text-center">
              <h3 class="u-justify-center">
                <span class="ic">🎧</span> Supervisor Live Status
              </h3>
              <div class="u-status-icon" id="supStatusIcon">
                🟢
              </div>
              <div class="u-status-text" id="supStatusText">
                Standing by
              </div>
              <div class="note" id="supStatusSub">
                Auto-alerts fire when triggers breach.
              </div>
              <div
                class="row u-justify-center u-mt-14"

              >
                <button class="btn mag" onclick="supAction('monitor')">
                  👂 Monitor</button
                ><button class="btn ghost" onclick="supAction('whisper')">
                  🤫 Whisper</button
                ><button class="btn ghost" onclick="supAction('barge')">
                  📞 Barge
                </button>
              </div>
            </div>
            <div class="card">
              <h3><span class="ic">📊</span> Session Alerts</h3>
              <div class="sum-line">
                <b>Total</b><span id="supTotal">0</span>
              </div>
              <div class="sum-line">
                <b>Barge-ins</b><span id="supBarges">0</span>
              </div>
              <div class="sum-line">
                <b>Whispers</b><span id="supWhispers">0</span>
              </div>
              <div class="sum-line">
                <b>Highest</b><span id="supMax">—</span>
              </div>
            </div>
            <div class="card">
              <h3><span class="ic">🤫</span> Send Whisper</h3>
              <input
	                class="search u-mb-10"
	                id="whisperInput"
	                aria-label="Whisper guidance"
	                placeholder="Guidance to agent…"

              /><button class="btn mag" onclick="sendWhisper()">Send</button>
            </div>
          </div>
          <div class="grid g2 u-mt-20">
            <div class="card">
              <h3><span class="ic">⚙️</span> Auto-Alert Triggers</h3>
              <div class="trig">
                <div class="info"><b>Fraud risk ≥</b></div>
                <div class="thresh">
                  <input
	                    type="number"
	                    id="thrFraud"
	                    aria-label="Fraud risk alert threshold"
	                    value="50"
                    min="10"
                    max="100"
                  /><label class="switch"
	                    ><input
	                      type="checkbox"
	                      id="onFraud"
	                      aria-label="Enable fraud risk alerts"
	                      checked
	                    /><span
                      class="slider"
                    ></span
                  ></label>
                </div>
              </div>
              <div class="trig">
                <div class="info"><b>Negative streak</b></div>
                <div class="thresh">
                  <input
	                    type="number"
	                    id="thrNeg"
	                    aria-label="Negative streak alert threshold"
	                    value="2"
                    min="1"
                    max="6"
                  /><label class="switch"
	                    ><input
	                      type="checkbox"
	                      id="onNeg"
	                      aria-label="Enable negative streak alerts"
	                      checked
	                    /><span
                      class="slider"
                    ></span
                  ></label>
                </div>
              </div>
              <div class="trig">
                <div class="info"><b>Escalation request</b></div>
                <div class="thresh">
                  <label class="switch"
	                    ><input
	                      type="checkbox"
	                      id="onEsc"
	                      aria-label="Enable escalation request alerts"
	                      checked
	                    /><span
                      class="slider"
                    ></span
                  ></label>
                </div>
              </div>
              <div class="trig">
                <div class="info"><b>Long call (min)</b></div>
                <div class="thresh">
                  <input
	                    type="number"
	                    id="thrDur"
	                    aria-label="Long call alert threshold in minutes"
	                    value="6"
                    min="1"
                    max="30"
                  /><label class="switch"
	                    ><input
	                      type="checkbox"
	                      id="onDur"
	                      aria-label="Enable long call alerts"
	                      checked
	                    /><span
                      class="slider"
                    ></span
                  ></label>
                </div>
              </div>
            </div>
            <div class="card">
              <h3><span class="ic">🚨</span> Alert Log</h3>
              <div class="u-scroll-y-320">
                <table id="supLog">
                  <tr>
                    <th>Time</th>
                    <th>Trigger</th>
                    <th>Detail</th>
                    <th>Action</th>
                  </tr>
                </table>
                <div
                  class="note u-text-center u-mt-30"
                  id="supEmpty"

                >
                  No alerts yet.
                </div>
              </div>
            </div>
          </div>
        </section>
