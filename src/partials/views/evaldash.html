        <section id="evaldash" class="view hidden">
          <h3 class="u-dashboard-title">
            <span class="ic">✅</span> Evaluator Dashboard
          </h3>
          <div class="grid g4" id="evKpis"></div>
          <div class="grid g2 u-mt-20">
            <div class="card">
              <h3><span class="ic">📊</span> Score Distribution</h3>
              <div id="evDist"></div>
            </div>
            <div class="card">
              <h3><span class="ic">⚠️</span> Lowest-Scoring (coach first)</h3>
              <div id="evLow"></div>
            </div>
          </div>
          <div class="card u-mt-20">
            <div class="folder-head">
              <h3><span class="ic">🗂️</span> All Interactions to Review</h3>
              <div class="row">
                <button class="btn ghost" onclick="exportEvalQA()">
                  ⬇️ Export QA Results (CSV)</button
                ><input
                  class="search u-max-w-260 u-mb-0"
                  id="evSearch"
                  aria-label="Search evaluations"
                  placeholder="🔍 Search…"

                  oninput="renderEval()"
                />
              </div>
            </div>
            <div id="evList"></div>
          </div>
        </section>
