        <section id="supqueue" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 style="font-size: 17px">
                <span class="ic">📥</span> Evaluations Inbox
                <span
                  class="pill-count hidden"
                  id="supInboxCount"
                  style="background: var(--magenta)"
                  >0</span
                >
              </h3>
              <div class="note">
                Evaluations sent by QA. Add feedback, then Notify QA.
              </div>
            </div>
            <select class="sel" id="supFilter" onchange="renderSupQueue()">
              <option value="all">All</option>
              <option value="sent">Awaiting feedback</option>
              <option value="feedback_done">Feedback done</option>
              <option value="qa_notified">QA notified</option>
            </select>
          </div>
          <div id="supQueueList"></div>
          <div
            class="note"
            id="supQueueEmpty"
            style="text-align: center; margin: 20px"
          >
            No evaluations yet.
          </div>
        </section>
