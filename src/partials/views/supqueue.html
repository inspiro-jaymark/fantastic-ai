        <section id="supqueue" class="view hidden">
          <div class="folder-head">
            <div>
              <h3 class="u-fs-17">
                <span class="ic">📥</span> Evaluations Inbox
                <span
                  class="pill-count hidden u-bg-magenta"
                  id="supInboxCount"

                  >0</span
                >
              </h3>
              <div class="note">
                Evaluations sent by QA. Add feedback, then Notify QA.
              </div>
            </div>
            <select class="sel" id="supFilter" aria-label="Supervisor queue filter" onchange="renderSupQueue()">
              <option value="all">All</option>
              <option value="sent">Awaiting feedback</option>
              <option value="feedback_done">Feedback done</option>
              <option value="qa_notified">QA notified</option>
            </select>
          </div>
          <div id="supQueueList"></div>
          <div
            class="note u-empty-inline"
            id="supQueueEmpty"

          >
            No evaluations yet.
          </div>
        </section>
